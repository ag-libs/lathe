name: Maven
description: >-
  The Maven that builds Lathe, from the Actions cache: a version's distribution never changes, so
  it is downloaded from Maven Central once per OS and then restored, under the key and path the
  invoker jobs use for their Maven too. Fetching it on every run failed jobs whenever Central
  refused or timed out (a 403).
inputs:
  version:
    description: The Maven version.
    required: true
runs:
  using: composite
  steps:
    # The cache's save at the end of the job cannot read this action's inputs (they are empty there),
    # so everything it needs goes through the environment, which it can read.
    - name: Name Maven ${{ inputs.version }}
      shell: bash
      run: |
        echo "LATHE_MAVEN_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
        echo "LATHE_MAVEN_HOME=$RUNNER_TEMP/apache-maven-${{ inputs.version }}" >> "$GITHUB_ENV"

    - name: Restore Maven ${{ inputs.version }}
      id: maven-dist
      uses: actions/cache@v6
      with:
        path: ${{ env.LATHE_MAVEN_HOME }}
        key: maven-dist-${{ runner.os }}-${{ env.LATHE_MAVEN_VERSION }}

    - name: Download Maven ${{ inputs.version }}
      if: steps.maven-dist.outputs.cache-hit != 'true'
      shell: bash
      # Unpacked from inside the temp directory: Windows tar reads the D: of a path like D:\a\_temp
      # as a remote host.
      working-directory: ${{ runner.temp }}
      run: |
        curl -fsSL --retry 5 --retry-all-errors -o maven.tar.gz \
          "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$LATHE_MAVEN_VERSION/apache-maven-$LATHE_MAVEN_VERSION-bin.tar.gz"
        tar xzf maven.tar.gz
        rm maven.tar.gz

    - name: Put Maven ${{ inputs.version }} on the PATH
      shell: bash
      run: echo "$LATHE_MAVEN_HOME/bin" >> "$GITHUB_PATH"
