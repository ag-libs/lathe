name: Windows Defender off
description: >-
  Prints Windows Defender's state, turns its scanning off for the rest of the job, and prints it
  again. The Windows Gradle rows pause before the first fixture test (14-33 s, once 11.5 min) where
  Ubuntu does not: Defender's behavior monitoring hooks every process start, and real-time and
  download scanning every file the builds write. The printed state says whether it was on at all.
  A runner is thrown away after the job, so nothing outlives it.
runs:
  using: composite
  steps:
    - name: Windows Defender
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $fields = 'AntivirusEnabled', 'RealTimeProtectionEnabled', 'BehaviorMonitorEnabled', 'IoavProtectionEnabled', 'OnAccessProtectionEnabled'
        try {
          Write-Output 'Before:'
          Get-MpComputerStatus | Select-Object $fields | Format-List
          Set-MpPreference -DisableRealtimeMonitoring $true -DisableBehaviorMonitoring $true -DisableIOAVProtection $true -DisableScriptScanning $true
          Write-Output 'After:'
          Get-MpComputerStatus | Select-Object $fields | Format-List
        } catch {
          Write-Output "Windows Defender could not be read or changed: $_"
        }
