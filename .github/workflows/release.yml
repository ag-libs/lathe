name: Release to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.1.0-beta.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Deploy to Maven Central
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set up Neovim
        # The release build runs the full verify, including the client specs.
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Resolve release version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Stamp project version
        # Option C: no ${revision}, no committed version bump — stamp the release
        # version into the ephemeral CI checkout only.
        run: >
          mvn -B --no-transfer-progress versions:set
          -DnewVersion=${{ steps.version.outputs.version }}
          -DprocessAllModules -DgenerateBackupPoms=false

      - name: Build, sign, and deploy
        # Formatting is verified in CI; skip spotless here so the transient
        # versions:set edit cannot fail the release. `env -u CI` runs the build
        # with Lathe enabled (see ci.yml) so the tests in the release build pass.
        run: env -u CI mvn -B --no-transfer-progress -Prelease -Dspotless.check.skip=true deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" --title "Lathe $GITHUB_REF_NAME" --generate-notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
