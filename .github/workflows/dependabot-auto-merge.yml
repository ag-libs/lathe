name: Dependabot auto-merge

# Enables GitHub's native auto-merge for low-risk Dependabot PRs: patch/minor bumps of
# development/test dependencies (npm devDependencies, Maven test-scope, GitHub Actions). The merge
# only lands once required CI checks pass. Runtime deps and every major update are left for manual
# review. Requires the repo's "Allow auto-merge" setting and a branch rule requiring CI on main.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2

      - name: Enable auto-merge for low-risk updates
        if: >-
          steps.meta.outputs.dependency-type == 'direct:development' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
