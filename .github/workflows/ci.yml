name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & verify (JDK ${{ matrix.java }}, ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 21 is the release baseline (see release.yml); 25 is the current LTS;
        # 27 is the latest release under active adoption and guards forward
        # compatibility (e.g. JDK-specific javac source-position and
        # CompletableFuture cancellation shapes). Bump the latest as it moves.
        java: [ '21', '25', '27' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Set up Maven 3.9.16
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.16

      - name: Set up Neovim
        # lathe-neovim's run-specs.sh needs nvim on PATH (it hard-fails under CI otherwise). VS Code's
        # Node is fetched by Maven via frontend-maven-plugin, so no setup-node step is needed.
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Build, test, install
        # `install` (not just `verify`) so the maven-invoker integration tests in
        # lathe-maven-plugin resolve the freshly built lathe artifacts from the
        # local repository.
        #
        # `env -u CI` removes the CI env var for the whole build tree (Surefire
        # forks, invoker builds, and their forks all inherit it), so Lathe runs
        # ENABLED during tests. Otherwise LatheFlags.isDisabled() treats CI=true
        # as a skip signal and every enabled-path test fails.
        #
        # The client modules are JDK-agnostic — build them once on JDK 21, exclude them elsewhere.
        run: |
          if [ "${{ matrix.java }}" = "21" ]; then
            env -u CI mvn -B --no-transfer-progress clean install
          else
            env -u CI mvn -B --no-transfer-progress clean install -pl '!lathe-neovim,!lathe-vscode'
          fi

      - name: Verify javadoc and sources generate
        # Catch javadoc/source-jar breakage here rather than mid-release, since
        # the release profile requires both for Maven Central.
        run: mvn -B --no-transfer-progress -DskipTests javadoc:jar source:jar-no-fork

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/'
          retention-days: 7
