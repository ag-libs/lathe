name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & verify (JDK ${{ matrix.java }}, ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 21 is the release baseline (see release.yml); 26 guards forward
        # compatibility (e.g. JDK-specific CompletableFuture cancellation shapes).
        java: [ '21', '26' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Set up Neovim
        # The Neovim client specs run during `verify` (run-specs.sh via
        # exec-maven-plugin); the script hard-fails the build under CI when nvim
        # is absent, so it must be on PATH. `stable` is >= the supported 0.11.7 floor.
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Build, test, install
        # `install` (not just `verify`) so the maven-invoker integration tests in
        # lathe-maven-plugin resolve the freshly built lathe artifacts from the
        # local repository.
        #
        # `env -u CI` removes the CI env var for the whole build tree (Surefire
        # forks, invoker builds, and their forks all inherit it), so Lathe runs
        # ENABLED during tests. Otherwise LatheFlags.isDisabled() treats CI=true
        # as a skip signal and every enabled-path test fails.
        run: env -u CI mvn -B --no-transfer-progress clean install

      - name: Verify javadoc and sources generate
        # Catch javadoc/source-jar breakage here rather than mid-release, since
        # the release profile requires both for Maven Central.
        run: mvn -B --no-transfer-progress -DskipTests javadoc:jar source:jar-no-fork

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/'
          retention-days: 7
