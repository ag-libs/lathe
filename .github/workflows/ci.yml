name: CI

on:
  push:
    branches: [ main ]
    # Documentation-only changes don't run the matrix.
    paths-ignore: [ 'docs/**', '**/*.md' ]
  pull_request:
    paths-ignore: [ 'docs/**', '**/*.md' ]
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & verify (JDK ${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A full build takes minutes; a hung test (a leftover process holding a pipe) fails the row
    # here instead of running until the 6-hour job limit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 17 is the floor Lathe runs on (the row builds on 21 and runs every test on 17); 21 is the
        # release baseline (see release.yml); 25 is the current LTS; 27 is the latest release under
        # active adoption and guards forward compatibility (e.g. JDK-specific javac source-position
        # and CompletableFuture cancellation shapes). Bump the latest as it moves.
        java: [ '17', '21', '25', '27' ]
        os: [ ubuntu-latest ]
        # macOS on the current LTS only: the OS-sensitive parts (launcher scripts, paths, temp dirs)
        # don't vary by JDK, so one row covers them.
        include:
          - java: '25'
            os: macos-latest
          # Windows on the current LTS too: it runs the generated .cmd scripts for real.
          - java: '25'
            os: windows-latest
    defaults:
      run:
        # The steps are bash on every OS (Git Bash ships with the Windows runner); the product
        # itself never needs bash there.
        shell: bash
    steps:
      - name: Enable long paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v7

      - name: Runner info
        uses: ./.github/actions/runner-info
        with:
          phase: start

      - name: Set up build tools
        uses: ./.github/actions/build-tools
        with:
          java: ${{ matrix.java }}

      - name: Set up Neovim
        # lathe-neovim's run-specs.sh needs nvim on PATH (it hard-fails under CI otherwise). VS Code's
        # Node is fetched by Maven via frontend-maven-plugin, so no setup-node step is needed. Neovim
        # isn't supported on Windows, so its specs don't run there.
        if: runner.os != 'Windows'
        uses: ./.github/actions/neovim

      - name: Build, test, install
        # `install` (not just `verify`) so the maven-invoker integration tests in
        # lathe-maven-plugin resolve the freshly built lathe artifacts from the
        # local repository.
        #
        # The CI variable keeps Lathe out of this build, as it does any project's CI build, so the
        # build does not sync its own .lathe/. Its tests still run Lathe enabled: Surefire sets
        # lathe.disabled=false in Lathe's own tests and the invoker passes it to the fixture builds
        # (and so to their test forks), and an explicit false wins over CI.
        #
        # The client modules are JDK-agnostic — build them on JDK 21 and on macOS (their scripts are
        # OS-sensitive), exclude them elsewhere.
        #
        # The JDK 17 row runs every test and the invoker fixture builds on JDK 17, and switches off
        # the multi-release test layering, which is for JDK 21+ test runs.
        #
        # The Gradle plugin is built and tested by the gradle jobs, in parallel with this one.
        env:
          GRADLE: -Dlathe.gradle.skip=true
        run: |
          if [ "${{ matrix.java }}" = "17" ]; then
            mvn -B --no-transfer-progress clean install -pl '!lathe-neovim,!lathe-vscode' \
              -Djvm="$JAVA_HOME_17_X64/bin/java" -Dinvoker.javaHome="$JAVA_HOME_17_X64" \
              -P '!multi-release-jdk21' $GRADLE
          elif [ "${{ matrix.java }}" = "21" ] || [ "${{ runner.os }}" = "macOS" ]; then
            mvn -B --no-transfer-progress clean install $GRADLE
          elif [ "${{ runner.os }}" = "Windows" ]; then
            # Neovim on Windows is a non-goal, so the row sets none up; the VS Code extension builds,
            # since Cursor on Windows is a target.
            mvn -B --no-transfer-progress clean install -pl '!lathe-neovim' $GRADLE
          else
            mvn -B --no-transfer-progress clean install -pl '!lathe-neovim,!lathe-vscode' $GRADLE
          fi

      - name: Show the fixtures' JDK cache use
        # Each fixture's sync logs where the JDK's sources and type index came from (extracted, built,
        # already cached, or waited for another build) and how long that took, in the fixture's own
        # build.log, which the job's output does not show: setup-support should be the only one that
        # extracts and builds them.
        if: always()
        run: grep -H "\[sync\] jdk" lathe-maven-plugin/target/it/*/build.log || true

      - name: Keep the invoker fixtures' downloads
        # The fixtures resolve into lathe-maven-plugin/target/local-repo, which the cache never
        # sees, so every run downloaded what only they use (formatters, Lombok, JUnit 5). Copied
        # into ~/.m2, the next run's fixtures copy them from there through src/it/settings.xml's
        # file:// repository. -n keeps every file ~/.m2 has, its _remote.repositories records
        # included; a skipped file is no error worth failing the job over.
        if: success() && ((matrix.java == '21' && runner.os == 'Linux') || runner.os != 'Linux')
        run: |
          if [ -d lathe-maven-plugin/target/local-repo ]; then
            cp -Rn lathe-maven-plugin/target/local-repo/. ~/.m2/repository/ || true
          fi

      - name: Save the Maven repository
        # From the row per OS that builds the most of the reactor, so the cache holds what every
        # job needs; a job building part of it would save a partial repository first.
        if: success() && ((matrix.java == '21' && runner.os == 'Linux') || runner.os != 'Linux')
        uses: actions/cache/save@v6
        with:
          # Lathe's own SNAPSHOTs, which the build installs, stay out: each run builds them afresh.
          path: |
            ~/.m2/repository
            !~/.m2/repository/io/github/ag-libs
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml', '!**/target/**') }}

      - name: Verify javadoc and sources generate
        # Catch javadoc/source-jar breakage here rather than mid-release, since
        # the release profile requires both for Maven Central. They don't depend on the OS or the
        # test JDK, so the release baseline row checks them.
        if: matrix.java == '21' && runner.os == 'Linux'
        run: mvn -B --no-transfer-progress -DskipTests javadoc:jar source:jar-no-fork

      - name: Runner info at the end
        if: always()
        uses: ./.github/actions/runner-info
        with:
          phase: end

      - name: Upload test reports
        # always(): a timed-out or cancelled run is when the reports matter most.
        if: always() && !success()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-jdk${{ matrix.java }}-${{ matrix.os }}
          path: |
            **/target/surefire-reports/
            lathe-maven-plugin/target/it/**/build.log
          retention-days: 7

  invoker-maven:
    # The Maven version matters only to the invoker suite, which runs the fixture builds with Maven;
    # Lathe itself builds on 3.9. Older and newer Maven releases get one invoker-only row each.
    name: Invoker (Maven ${{ matrix.maven }}, JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - maven: '3.6.3'
            java: '17'
          - maven: '3.8.8'
            java: '21'
          - maven: '3.10.0'
            java: '21'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Runner info
        uses: ./.github/actions/runner-info
        with:
          phase: start

      - name: Set up build tools
        uses: ./.github/actions/build-tools
        with:
          java: ${{ matrix.java }}

      # The distribution never changes for a version, so it is downloaded once and then restored.
      - name: Restore Maven ${{ matrix.maven }} for the fixture builds
        id: maven-dist
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/apache-maven-${{ matrix.maven }}
          key: maven-dist-${{ runner.os }}-${{ matrix.maven }}

      # From Maven Central, which publishes every Maven distribution behind a CDN: archive.apache.org
      # is a single host that times out under load and failed the invoker jobs.
      - name: Download Maven ${{ matrix.maven }} for the fixture builds
        if: steps.maven-dist.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${{ matrix.maven }}/apache-maven-${{ matrix.maven }}-bin.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"

      - name: Invoker suite
        # Builds the reactor without running unit tests (maven.test.skip.exec; skipTests would also skip
        # the invoker), so every extraArtifact comes from this build, then runs the fixture builds with
        # Maven ${{ matrix.maven }} on JDK ${{ matrix.java }}, which run Lathe enabled
        # (lathe.disabled=false).
        run: |
          mvn -B --no-transfer-progress verify -pl '!lathe-neovim,!lathe-vscode' -Dmaven.test.skip.exec=true \
            -Dinvoker.mavenHome="$RUNNER_TEMP/apache-maven-${{ matrix.maven }}" \
            -Dinvoker.javaHome="$JAVA_HOME_${{ matrix.java }}_X64" -Dlathe.gradle.skip=true

      - name: Show the fixtures' JDK cache use
        # Each fixture's sync logs where the JDK's sources and type index came from (extracted, built,
        # already cached, or waited for another build) and how long that took, in the fixture's own
        # build.log, which the job's output does not show: setup-support should be the only one that
        # extracts and builds them.
        if: always()
        run: grep -H "\[sync\] jdk" lathe-maven-plugin/target/it/*/build.log || true

      - name: Runner info at the end
        if: always()
        uses: ./.github/actions/runner-info
        with:
          phase: end

      - name: Upload invoker logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: invoker-logs-maven${{ matrix.maven }}-jdk${{ matrix.java }}
          path: lathe-maven-plugin/target/it/**/build.log
          retention-days: 7

  gradle:
    # The Gradle plugin in its own jobs, so its build runs beside the Maven rows instead of after the
    # rest of a sequential reactor. Each job builds only what the plugin needs, without those modules'
    # tests (the build rows run them), then the plugin's build: unit tests where the plugin builds on
    # the latest Gradle, and the TestKit fixtures on the Gradle in the row. Windows, where paths and
    # processes differ most, runs the latest Gradle and the 8.8 floor on JDK 17.
    name: Gradle ${{ matrix.gradle }} (JDK ${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - gradle: '9.8.2'
            os: windows-latest
            java: '25'
            unit: true
          - gradle: '9.8.2'
            os: ubuntu-latest
            java: '21'
            unit: true
          - gradle: '8.8'
            os: windows-latest
            java: '17'
            unit: false
          - gradle: '8.14.6'
            os: ubuntu-latest
            java: '21'
            unit: false
          - gradle: '9.0.0'
            os: ubuntu-latest
            java: '21'
            unit: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable long paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v7

      - name: Runner info
        uses: ./.github/actions/runner-info
        with:
          phase: start

      - name: Set up build tools
        uses: ./.github/actions/build-tools
        with:
          java: ${{ matrix.java }}

      - name: Download Gradle ${{ matrix.gradle }} for the fixture builds
        # The plugin itself builds on the Gradle the build tools set up; only the fixtures use this one.
        if: matrix.gradle != '9.8.2'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-${{ matrix.gradle }}-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

      - name: Cache the fixtures' Gradle user home
        # TestKit runs the fixtures with a Gradle user home of their own, ~/.gradle/lathe-testkit,
        # which the Gradle cache above does not cover: each job regenerated the Gradle API jar
        # (about 185 MB) and recompiled the fixtures' Kotlin scripts, slowest on Windows. Per OS,
        # Gradle and JDK, since those generated files depend on all three.
        uses: actions/cache@v6
        with:
          path: ~/.gradle/lathe-testkit/caches
          key: gradle-testkit-${{ runner.os }}-${{ matrix.gradle }}-jdk${{ matrix.java }}-${{ hashFiles('lathe-gradle-plugin/build.gradle.kts', 'lathe-gradle-plugin/settings.gradle.kts', 'lathe-gradle-plugin/gradle.properties') }}
          restore-keys: gradle-testkit-${{ runner.os }}-${{ matrix.gradle }}-jdk${{ matrix.java }}-

      - name: Build and test the Gradle plugin
        # maven.test.skip leaves out the dependencies' tests; lathe.gradle.skipUnitTests says whether
        # the plugin's own run. lathe-junit is named because the fixtures get it as an extra
        # artifact, which -am does not follow. Formatting is checked by the build rows. As in the
        # build rows, CI stays set and keeps Lathe out of this build; the fixtures run without it
        # (GradleFixture), so Lathe is enabled in them. An older Gradle's fixtures run on the row's
        # JDK (17 for the floor).
        env:
          FIXTURES: ${{ matrix.gradle != '9.8.2' && format('-Dlathe.gradle.fixturesHome={0}/gradle-{1}', runner.temp, matrix.gradle) || '' }}
        run: |
          mvn -B --no-transfer-progress verify -pl lathe-junit,lathe-gradle-plugin -am \
            -Dmaven.test.skip=true -Dspotless.check.skip=true \
            -Dlathe.gradle.skipUnitTests=${{ !matrix.unit }} $FIXTURES \
            -Dlathe.gradle.fixturesJavaHome="$JAVA_HOME_${{ matrix.java }}_X64"

      - name: Slowest Gradle plugin tests
        # The per-test times, every run: comparing a slow run with a fast one shows whether the time
        # went into a few tests (each test class's first, which starts its Gradle daemon) or all.
        if: always()
        run: |
          PY=$(command -v python || command -v python3) || true
          "$PY" - <<'EOF' || true
          import glob, xml.etree.ElementTree as ET
          rows = []
          for f in glob.glob("lathe-gradle-plugin/target/gradle/test-results/*/TEST-*.xml"):
              suite = ET.parse(f).getroot()
              for i, tc in enumerate(suite.iter("testcase")):
                  rows.append((float(tc.get("time") or 0), i + 1, suite.get("name").rsplit(".", 1)[-1], tc.get("name")))
          rows.sort(reverse=True)
          for t, i, c, n in rows[:12]:
              print("%7.1fs  #%-2d %s.%s" % (t, i, c, n))
          print("%d tests, %.0fs of test time" % (len(rows), sum(r[0] for r in rows)))
          EOF

      - name: Upload test results
        # Small, and kept for every run, not only failed ones, so a slow run can be compared with a
        # fast one test by test.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-results-${{ matrix.gradle }}-jdk${{ matrix.java }}-${{ matrix.os }}
          path: lathe-gradle-plugin/target/gradle/test-results/**/*.xml
          retention-days: 14

      - name: Runner info at the end
        if: always()
        uses: ./.github/actions/runner-info
        with:
          phase: end

      - name: Upload test reports
        if: always() && !success()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-reports-${{ matrix.gradle }}-jdk${{ matrix.java }}-${{ matrix.os }}
          path: lathe-gradle-plugin/target/gradle/reports/tests/
          retention-days: 7
