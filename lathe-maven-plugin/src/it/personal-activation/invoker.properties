# Lathe brought in from the command line, as :LatheInit does for a project that does not register
# it: the extension and its runtime dependencies (no transitive resolution on this path), with
# compile errors kept from stopping the build. core does not compile; the build must still succeed
# and capture every module, which PersonalActivationTest checks.
invoker.goals=-Dmaven.ext.class.path=${lathe.it.extClassPath} -Dmaven.compiler.failOnError=false test
invoker.buildResult=success
